<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>
        Заметки
    </h1>

    <div>
        <a href="/todos/new">Создать заметку</a>
    </div>

    <form method="get" action="/" id="filter_form">
        <label> Skip:
            <input type="number" name="skip" value="{{ skip }}" min="0">
        </label>

        <label> Limit:
            <input type="number" name="limit" value="{{ limit }}" min="1">
        </label>

        <label> Status:
            <select name="is_completed">
                <option value="" {% if is_completed is none %} selected {% endif%}>
                    Показать все
                </option>

                <option value="true" {% if is_completed is true %} selected {% endif%}>
                    Выполненные
                </option>

                <option value="false" {% if is_completed is false %} selected {% endif%}>
                    Невыполненные
                </option>
            </select>
        </label>
        <button type="submit">Применить</button>
    </form>

    <div id="todos_container">
        {% if todos %}

            {% for todo in todos %}
                <div>
                    {{todo.title}}<br>
                    {{todo.description}}<br>
                    {{todo.is_completed}}
                    <a href="todos/update_form">редактировать</a>
                </div>

            {% endfor %}


        {% else %}
        <p>no</p>
        
        {% endif %}
    </div>

</body>

</html>
