<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/static/style.css" rel="stylesheet">

</head>

<body>

    <h1 class="create_todo">Заполните поля новой заметк</h1>
    {% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
    {% endif %}
    <form method="post" action="/todos/create">
        <label>
            Название: <br>
            <input type="text" name="title" 
            required minlength="1" 
            maxlength="256" class="input_text"
            value="{{ form_title | default('')}}">
        </label><br><br>

        <label>
            Описание: <br>
            <textarea type="text" name="description" 
            class="input_text" required 
            maxlength="512" rows="5" cols="80">{{form_description | default('')}}</textarea>
        </label><br><br>

        <label>
            Напоминание: <br>
            <input class="input_text"
            type="datetime-local"
            name="reminder_at">
        </label><br><br>

        <div class="form-check">
            <input class="form-check-input" 
            type="checkbox" 
            id="gridCheck" 
            name="is_completed"
            {% if form_is_competed %} checked {% endif %}>
            <label class="form-check-label" for="gridCheck">
                Задача выполнена.
            </label>
        </div>
        
        <button type="submit" class="btn btn-primary">Добавить</button>
        <button type="button" class="btn btn-primary">
            <a href="/">Вернуться на главную</a>
        </button>

    </form>

</body>

</html>
